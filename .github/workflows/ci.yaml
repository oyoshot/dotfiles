name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 10 * * 6"
  workflow_dispatch:

env:
  CHEZMOI_VERSION: 2.69.3

jobs:
  validate-mac:
    name: validate (mac)
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-validate-mac-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/validate
        with:
          chezmoi-version: ${{ env.CHEZMOI_VERSION }}

  validate-arch:
    name: validate (arch)
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-validate-arch-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: true
    container:
      image: archlinux@sha256:644b416048d39616bbaca93ce768ba492655c83fba80ceca65a4f59dcabdcac0
      options: >-
        --tmpfs /tmp:exec,mode=1777
        --tmpfs /var/tmp:exec,mode=1777
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: ./.github/actions/validate
        with:
          chezmoi-version: ${{ env.CHEZMOI_VERSION }}

  provisioning-changes:
    name: detect provisioning changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - id: changes
        name: Detect platform provisioning changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --no-renames --name-only "${BASE_SHA}...${HEAD_SHA}" >/tmp/changed-files

          provisioning_pattern='^(\.chezmoiignore$|\.chezmoiscripts/|\.chezmoiexternal|dot_config/mise/|dot_config/homebrew/Brewfile$|dot_config/yay/extra-packages$|\.github/actions/(mac|arch)/|\.github/workflows/ci\.yaml$)'
          run=false
          if grep -Eq "${provisioning_pattern}" /tmp/changed-files; then
            run=true
          fi

          echo "run=${run}" >>"${GITHUB_OUTPUT}"
          echo "Changed files:"
          sed 's/^/  /' /tmp/changed-files

  provision-mac:
    name: provision (mac)
    needs: provisioning-changes
    if: ${{ needs.provisioning-changes.outputs.run == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: read
    concurrency:
      group: ci-provision-mac-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - id: cache-epoch
        name: Resolve cache epoch
        shell: bash
        run: echo "value=$(date -u +%G-W%V)" >>"${GITHUB_OUTPUT}"
      - uses: ./.github/actions/mac
        with:
          cache-epoch: ${{ steps.cache-epoch.outputs.value }}
          chezmoi-version: ${{ env.CHEZMOI_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  provision-arch:
    name: provision (arch)
    needs: provisioning-changes
    if: ${{ needs.provisioning-changes.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    concurrency:
      group: ci-provision-arch-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    container:
      image: archlinux@sha256:644b416048d39616bbaca93ce768ba492655c83fba80ceca65a4f59dcabdcac0
      volumes:
        - /mnt/pac-pkg:/var/cache/pacman/pkg
        - /mnt/yay-pkg:/home/builder/.cache/yay
      options: >-
        --tmpfs /tmp:exec,mode=1777
        --tmpfs /var/tmp:exec,mode=1777
        --shm-size 2g
    steps:
      - name: Free disk space on host toolcache
        shell: bash
        run: rm -rf /__t/*
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - id: cache-epoch
        name: Resolve cache epoch
        shell: bash
        run: echo "value=$(date -u +%G-W%V)" >>"${GITHUB_OUTPUT}"
      - uses: ./.github/actions/arch
        with:
          cache-epoch: ${{ steps.cache-epoch.outputs.value }}
          chezmoi-version: ${{ env.CHEZMOI_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  scheduled-provision-mac:
    name: scheduled provision (mac)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 180
    permissions:
      contents: read
    concurrency:
      group: ci-warm-mac-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - id: cache-epoch
        name: Resolve cache epoch
        shell: bash
        run: echo "value=$(date -u +%G-W%V)" >>"${GITHUB_OUTPUT}"
      - uses: ./.github/actions/mac
        with:
          cache-epoch: ${{ steps.cache-epoch.outputs.value }}
          chezmoi-version: ${{ env.CHEZMOI_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  scheduled-provision-arch:
    name: scheduled provision (arch)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    concurrency:
      group: ci-warm-arch-${{ github.ref_name }}
      cancel-in-progress: true
    container:
      image: archlinux@sha256:644b416048d39616bbaca93ce768ba492655c83fba80ceca65a4f59dcabdcac0
      volumes:
        - /mnt/pac-pkg:/var/cache/pacman/pkg
        - /mnt/yay-pkg:/home/builder/.cache/yay
      options: >-
        --tmpfs /tmp:exec,mode=1777
        --tmpfs /var/tmp:exec,mode=1777
        --shm-size 2g
    steps:
      - name: Free disk space on host toolcache
        shell: bash
        run: rm -rf /__t/*
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - id: cache-epoch
        name: Resolve cache epoch
        shell: bash
        run: echo "value=$(date -u +%G-W%V)" >>"${GITHUB_OUTPUT}"
      - uses: ./.github/actions/arch
        with:
          cache-epoch: ${{ steps.cache-epoch.outputs.value }}
          chezmoi-version: ${{ env.CHEZMOI_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
