name: Validate Home Manager
description: Evaluate all pinned Home Manager configurations
runs:
  using: composite
  steps:
    - name: Install pinned Nix
      shell: bash
      run: sh .github/scripts/install-nix.sh
    - name: Evaluate Home Manager configurations
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.nix-profile/bin:/nix/var/nix/profiles/default/bin:$PATH"
        export NIX_CONFIG='experimental-features = nix-command flakes'
        nix flake check --all-systems --no-build --no-update-lock-file
        for configuration in oyoshot-linux oyoshot-darwin ci-linux ci-darwin; do
          nix eval --raw ".#homeConfigurations.${configuration}.activationPackage.drvPath" >/dev/null
        done
