name: Mac Setup
description: Restore caches, activate Home Manager, and provision host tools

inputs:
  brewfile-path:
    description: "Path to Brewfile"
    default: config/homebrew/Brewfile
  mise-config-path:
    description: "Path to mise config"
    default: config/mise/config.toml
  cache-epoch:
    description: "Cache generation identifier"
    required: true
  github-token:
    description: "GitHub token for explicit host provisioning"
    default: ""

runs:
  using: composite
  steps:
    - id: brew-cache-restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: macos-brew-v4-${{ hashFiles(inputs.brewfile-path) }}-${{ inputs.cache-epoch }}
        restore-keys: |
          macos-brew-v4-${{ hashFiles(inputs.brewfile-path) }}-
        path: ~/Library/Caches/Homebrew

    - id: mise-cache-restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        # Rebuild Cargo tools against Nix OpenSSL after the Homebrew migration.
        key: macos-mise-v7-${{ hashFiles(inputs.mise-config-path) }}-${{ inputs.cache-epoch }}
        restore-keys: |
          macos-mise-v7-${{ hashFiles(inputs.mise-config-path) }}-
        path: |
          ~/.cache/mise
          ~/.local/share/mise/installs

    - name: Install pinned Nix
      shell: bash
      run: sh .github/scripts/install-nix.sh

    - name: Build and cache custom Nix packages
      uses: ./.github/actions/nix-build-cache

    - name: Activate Home Manager
      shell: bash
      env:
        NIX_CONFIG: "experimental-features = nix-command flakes"
      run: |
        export XDG_STATE_HOME="$HOME/.local/state"
        export PATH="/nix/var/nix/profiles/default/bin:$PATH"
        nix \
          --extra-experimental-features 'nix-command flakes' run .#home-manager -- -b before-home-manager \
          switch --flake .#ci-darwin

    - name: Provision host tools
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 120s
        MISE_HTTP_TIMEOUT: 120s
        MISE_HTTP_RETRIES: "5"
        MISE_JOBS: 2
      run: |
        set -euo pipefail
        export XDG_STATE_HOME="$HOME/.local/state"
        sh scripts/bootstrap-host.sh

    - name: Re-activate Home Manager
      shell: bash
      env:
        NIX_CONFIG: "experimental-features = nix-command flakes"
      run: |
        set -euo pipefail
        export XDG_STATE_HOME="$HOME/.local/state"
        export PATH="/nix/var/nix/profiles/default/bin:$PATH"
        nix run --no-update-lock-file .#home-manager -- -b before-home-manager switch --flake .#ci-darwin

    - name: Verify macOS development tools
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$HOME/.local/state/nix/profile/bin:$PATH"
        case "$(mise exec -- pkg-config --variable=prefix openssl)" in
          /nix/store/*) ;;
          *) echo "OpenSSL must come from Nix" >&2; exit 1 ;;
        esac
        probe=$(mktemp -d)
        printf '#include <openssl/crypto.h>\nint main(void) { return OpenSSL_version_num() == 0; }\n' > "$probe/openssl.c"
        mise exec -- sh -c '/usr/bin/clang "$1/openssl.c" $(pkg-config --cflags --libs openssl) -o "$1/openssl"' sh "$probe"
        "$probe/openssl"
        for compiler in "$HOME"/.local/bin/{gcc,g++,gfortran}-*; do
          "$compiler" --version
        done
        docker --version
        docker compose version

    - name: Save Homebrew cache
      if: success()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: macos-brew-v4-${{ hashFiles(inputs.brewfile-path) }}-${{ inputs.cache-epoch }}
        path: ~/Library/Caches/Homebrew

    - name: Save mise cache
      if: success()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: macos-mise-v7-${{ hashFiles(inputs.mise-config-path) }}-${{ inputs.cache-epoch }}
        path: |
          ~/.cache/mise
          ~/.local/share/mise/installs
