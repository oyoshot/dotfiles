name: Build custom Nix packages
description: Restore and save the runtime closures of locally built packages
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: /tmp/dotfiles-nix-cache
        # Include the script so changes to the cached package set get a new entry.
        key: nix-custom-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix', 'packages/**', '.github/scripts/cache-nix.sh') }}
        restore-keys: |
          nix-custom-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Import cache and build custom packages
      shell: bash
      run: bash .github/scripts/cache-nix.sh
    - name: Save custom package cache
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: /tmp/dotfiles-nix-cache
        key: ${{ steps.restore.outputs.cache-primary-key }}
