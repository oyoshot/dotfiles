name: Arch Linux Setup
description: Bootstrap Arch environment, restore caches, activate Home Manager, and provision host tools

inputs:
  arch-extra-packages-path:
    description: "Path to Arch extra packages list"
    default: config/yay/extra-packages
  mise-config-path:
    description: "Path to mise config"
    default: config/mise/config.toml
  cache-epoch:
    description: "Cache generation identifier"
    required: true
  github-token:
    description: "GitHub token for explicit host provisioning"
    default: ""

runs:
  using: composite
  steps:
    - name: Validate mounted cache volumes
      shell: bash
      run: |
        set -euo pipefail
        required_paths=(
          /var/cache/pacman/pkg
          /home/builder/.cache/yay
        )
        for p in "${required_paths[@]}"; do
          if [[ ! -d "${p}" ]]; then
            echo "Required cache mount is missing: ${p}" >&2
            exit 1
          fi
          if ! awk -v mp="${p}" '$5 == mp { found=1 } END { exit !found }' /proc/self/mountinfo; then
            echo "Required cache path is not a mounted filesystem: ${p}" >&2
            exit 1
          fi
        done

    - id: pacman-cache-restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: arch-pacman-v4-${{ hashFiles(inputs.arch-extra-packages-path) }}-${{ inputs.cache-epoch }}
        restore-keys: |
          arch-pacman-v4-${{ hashFiles(inputs.arch-extra-packages-path) }}-
        path: |
          /var/cache/pacman/pkg
          /etc/pacman.d/gnupg

    - id: yay-cache-restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: arch-yay-v4-${{ hashFiles(inputs.arch-extra-packages-path) }}-${{ inputs.cache-epoch }}
        restore-keys: |
          arch-yay-v4-${{ hashFiles(inputs.arch-extra-packages-path) }}-
        path: /home/builder/.cache/yay

    - id: mise-cache-restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: arch-mise-v5-${{ hashFiles(inputs.mise-config-path) }}-${{ inputs.cache-epoch }}
        restore-keys: |
          arch-mise-v5-${{ hashFiles(inputs.mise-config-path) }}-
        path: /home/builder/.cache/mise

    - name: System bootstrap (root)
      shell: bash
      run: |
        set -euo pipefail
        pacman-key --init
        pacman-key --populate archlinux
        pacman -Syu --noconfirm archlinux-keyring
        pacman -S --needed --noconfirm base-devel git zsh sudo util-linux curl ca-certificates tar gzip pacman-contrib

    - name: Create builder user
      shell: bash
      run: |
        set -euo pipefail
        if ! id builder >/dev/null 2>&1; then
          useradd --uid 1000 --create-home builder
        fi
        echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
        chown -R builder:builder /home/builder "$GITHUB_WORKSPACE"

    - name: Prepare builder home
      shell: bash
      run: |
        set -euo pipefail
        sudo -u builder install -d \
          /home/builder/.cache \
          /home/builder/.local

    - name: Install pinned Nix (builder)
      shell: bash
      run: sudo -Hu builder sh "${GITHUB_WORKSPACE}/.github/scripts/install-nix.sh"

    - name: Build and cache custom Nix packages
      uses: ./.github/actions/nix-build-cache

    - name: Activate Home Manager (builder)
      shell: bash
      run: |
        sudo -Hu builder env \
          PATH="/home/builder/.nix-profile/bin:/usr/local/bin:/usr/bin:/bin" \
          NIX_CONFIG="experimental-features = nix-command flakes" nix \
          --extra-experimental-features 'nix-command flakes' run .#home-manager -- -b before-home-manager \
          switch --flake .#ci-linux

    - name: Provision host tools (builder)
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 120s
        MISE_HTTP_TIMEOUT: 120s
        MISE_HTTP_RETRIES: "5"
        MISE_JOBS: 2
      run: |
        set -euo pipefail
        sudo -Hu builder env \
          GITHUB_TOKEN="${GITHUB_TOKEN}" \
          MISE_FETCH_REMOTE_VERSIONS_TIMEOUT="${MISE_FETCH_REMOTE_VERSIONS_TIMEOUT}" \
          MISE_HTTP_TIMEOUT="${MISE_HTTP_TIMEOUT}" \
          MISE_HTTP_RETRIES="${MISE_HTTP_RETRIES}" \
          MISE_JOBS="${MISE_JOBS}" \
          sh "${GITHUB_WORKSPACE}/scripts/bootstrap-host.sh"

    - name: Check Nix CLI environment (builder)
      shell: bash
      run: sudo -Hu builder sh "${GITHUB_WORKSPACE}/.github/scripts/check-nix.sh"

    - name: Save pacman cache
      if: success()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: arch-pacman-v4-${{ hashFiles(inputs.arch-extra-packages-path) }}-${{ inputs.cache-epoch }}
        path: |
          /var/cache/pacman/pkg
          /etc/pacman.d/gnupg

    - name: Save yay cache
      if: success()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: arch-yay-v4-${{ hashFiles(inputs.arch-extra-packages-path) }}-${{ inputs.cache-epoch }}
        path: /home/builder/.cache/yay

    - name: Save mise cache
      if: success()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        key: arch-mise-v5-${{ hashFiles(inputs.mise-config-path) }}-${{ inputs.cache-epoch }}
        path: /home/builder/.cache/mise
