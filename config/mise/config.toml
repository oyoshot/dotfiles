# Initial tool defaults, copied once to the mutable user configuration.
# Common settings are declared in home.nix; edit versions with mise use --global.

[tools]
# ghc = "latest"
bun = "latest"
deno = "latest"
elixir = "latest"
erlang = "latest"
go = "latest"
gradle = "latest"
java = "latest"
julia = "latest"
kotlin = "latest"
node = "22"
pnpm = "latest"
python = "3.13"
ruby = "latest"
rye = "latest"
rust = "latest"
scala = "latest"
terraform = ["1.0.11", "1.5.7", "latest"]
# Project tooling follows the original rolling-version policy.
helm = "latest"
kubectl = "latest"
oc = "latest"
odo = "latest"
opentofu = "latest"
pulumi = "latest"
tekton = "latest"
terraform-ls = "latest"
tflint = "latest"
tfsec = "latest"
zig = "latest"

# Editor tooling is project-scoped; Neovim itself stays in Home Manager.
"npm:pyright" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"pipx:ruff" = "latest"
prettier = "latest"
"npm:@fsouza/prettierd" = "latest"
stylua = "latest"
"npm:bash-language-server" = "latest"
lua-language-server = "latest"
"npm:@vtsls/language-server" = "latest"
cspell = "latest"
shellcheck = "latest"
shfmt = "latest"
tree-sitter = "latest"

"cargo:cargo-compete" = "latest"
"cargo:cargo-audit" = "latest"
"cargo:cargo-chef" = "latest"
"cargo:cargo-crev" = "latest"
"cargo:cargo-deny" = "latest"
"cargo:cargo-expand" = "latest"
"cargo:cargo-features-manager" = "latest"
"cargo:flamegraph" = "latest"
"cargo:cargo-generate" = "latest"
"cargo:cargo-lambda" = "latest"
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-machete" = "latest"
"cargo:cargo-make" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-sort" = "latest"
"cargo:cargo-udeps" = "latest"
"cargo:cargo-update" = "latest"
"cargo:typos-lsp" = "latest"
"cargo:typos-cli" = "latest"
"cargo:https://github.com/Feel-ix-343/markdown-oxide.git" = "latest"

"go:github.com/mattn/memo" = "latest"

"npm:@astrojs/language-server" = "latest"
"npm:@astrojs/ts-plugin" = "latest"
"npm:atcoder-cli" = "latest"
"npm:mcp-hub" = "latest"
"npm:md-to-pdf" = "latest"
"npm:prh" = "latest"
# textlint はルールを本体と同じ node_modules から解決するため、bun_args で同居させる
"npm:textlint" = { version = "latest", bun_args = "textlint-rule-preset-ja-technical-writing textlint-rule-preset-ja-spacing textlint-rule-preset-jtf-style textlint-rule-prh textlint-rule-terminology @textlint/textlint-plugin-markdown" }
