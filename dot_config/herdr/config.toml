onboarding = false

[keys]
# Navigate mode (prefix+w) only: pick workspaces with j/k like nvim,
# and move panes with the arrow keys instead.
# Normal pane movement (prefix+h/j/k/l) is unaffected.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

# Jump directly to an agent by its visible sidebar index.
# Use the native prefix+g navigator when browsing or searching.
focus_agent = "prefix+shift+1..9"

# ghq と zoxide をまとめて曖昧検索し、workspace または tab で開く。
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.config/herdr/scripts/herdr-open-launcher"
description = "find and open a directory"
width = "70%"
height = "70%"

[ui]
# Keep agents needing attention at the top. This order is also used by
# indexed agent navigation.
agent_panel_sort = "priority"

[ui.sidebar.agents]
# herdr-plugin-renamer replaces the agent display label with the generated task.
# Before naming completes, this falls back to the detected agent name.
rows = [
  ["state_icon", "agent"],
  ["workspace", "tab"],
]
